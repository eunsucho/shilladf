<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>전략 3 · Shilla DF</title>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #faf7f2;
      --ink: #18120c;
      --ink-soft: #5a4f43;
      --ink-mute: #8a8175;
      --line: #ebe4d8;
      --accent: #8a1c2a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Pretendard', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-mute);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 40px;
    }
    .back:hover { color: var(--ink); }
    .num {
      font-family: 'Inter', monospace;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent);
    }
    h1 {
      font-size: 40px;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin: 14px 0 18px;
      line-height: 1.15;
    }
    .lede {
      font-size: 17px;
      color: var(--ink-soft);
      line-height: 1.65;
      margin: 0 0 48px;
    }
    .placeholder {
      padding: 56px 28px;
      border: 1px dashed var(--line);
      border-radius: 16px;
      background: #fff;
      text-align: center;
      color: var(--ink-mute);
    }
    .placeholder strong {
      display: block;
      font-size: 15px;
      color: var(--ink);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .placeholder span {
      font-size: 13.5px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 전략 목록으로</a>
    <span class="num">STRATEGY 03</span>
    <h1>전략 3</h1>
    <p class="lede">이 페이지는 자리 표시용입니다. 실제 프로토타입 HTML을 <code>strategy3.html</code> 파일로 덮어쓰면 바로 연결됩니다.</p>
    <div class="placeholder">
      <strong>아직 준비 중인 데모예요</strong>
      <span>곧 이곳에 인터랙티브한 흐름이 올라옵니다.</span>
    </div>
  </div>
</body>
</html>
